<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PuntoX Smart POS</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect x=%276%27 y=%2720%27 width=%2752%27 height=%2738%27 rx=%279%27 fill=%27%2300A6FF%27/%3E%3Cpath d=%27M22 28h14a7 7 0 010 14H30v8h-8z%27 fill=%27white%27/%3E%3Cpath d=%27M38 58l10-12 10 12z%27 fill=%27%23F6A623%27/%3E%3C/svg%3E"><meta name="description" content="PuntoX Smart POS: tu negocio, en un solo punto."><meta name="theme-color" content="#0B1F44">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bl:#00A6FF;--nv:#0B1F44;--or:#F6A623;--bg:#F8FAFC;--card:#fff;--tx:#0B1F44;--mu:#64748b;--bd:#e2e8f0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1730;--card:#10224a;--tx:#F8FAFC;--mu:#94a3b8;--bd:#1e3a6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1730;--card:#10224a;--tx:#F8FAFC;--mu:#94a3b8;--bd:#1e3a6e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
input,select,button{font:inherit}input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:4px 0}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--bl);color:#fff;font-weight:600}button.o{background:var(--or)}button.g{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:6px 10px}
.app{display:flex;min-height:100vh}.side{width:210px;background:var(--nv);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.side .lg{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;margin-bottom:14px}.side .lg b{color:var(--bl)}
.nv{background:transparent;text-align:left;color:#cbd5e1;display:flex;gap:10px;white-space:nowrap}.nv.on{background:var(--bl);color:#fff}
.main{flex:1;padding:18px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.top h2{margin:0}
.top .r{display:flex;gap:8px;align-items:center}.top select{width:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 2px 8px #0b1f4412}.card h3{margin:0 0 10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.kpi{border-left:5px solid var(--bl)}.kpi.a{border-color:#10b981}.kpi.b{border-color:var(--or)}.kpi small{color:var(--mu)}.kpi div{font-size:26px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.tile{background:var(--card);color:var(--tx);border:1px solid var(--bd);text-align:center;padding:14px 8px}.tile span{display:block;font-size:24px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.tot{font-size:28px;font-weight:800;color:var(--bl);margin:10px 0}.mu{color:var(--mu)}
.sg button{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);margin:4px 0;border:1px solid var(--bd)}
.login{min-height:100vh;display:flex;flex-wrap:wrap}.login .l{flex:1;min-width:280px;background:linear-gradient(135deg,#0B1F44,#0a3a8a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.login .l h1{font-size:40px;margin:10px 0 0;font-weight:800}.login .l h1 b{color:var(--bl)}.login .l p{font-size:20px}.login .l p i{color:var(--bl)}
.login .rr{flex:1;min-width:280px;display:flex;align-items:center;justify-content:center;padding:30px}.login .rr .card{width:100%;max-width:340px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:10px;z-index:9}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes ti{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
button,.card,.tile{transition:transform .18s ease,box-shadow .18s ease,background .2s ease,opacity .2s}button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}button:active:not(:disabled){transform:scale(.96)}button:disabled{opacity:.5;cursor:not-allowed}.tile:hover,.kpi:hover{transform:translateY(-4px);box-shadow:0 8px 20px #00a6ff33}input:focus,select:focus{outline:2px solid var(--bl);border-color:transparent}.nv{transition:background .2s,padding-left .2s}.nv:hover{padding-left:18px}
.toast{animation:ti .3s ease}.login .l svg{animation:fl 3.2s ease-in-out infinite}.login .l h1,.login .l p{animation:up .7s ease both}.login .rr .card{animation:pop .5s ease both}
.main.anim .top{animation:up .3s ease both}.main.anim .card,.main.anim .tile{animation:up .45s ease both}.main.anim .tile:nth-child(2),.main.anim .grid3>:nth-child(2){animation-delay:.07s}.main.anim .tile:nth-child(3),.main.anim .grid3>:nth-child(3),.main.anim .grid2>:nth-child(2){animation-delay:.14s}.main.anim .tile:nth-child(4){animation-delay:.21s}.main.anim .tile:nth-child(5){animation-delay:.28s}.main.anim polyline{stroke-dasharray:700;stroke-dashoffset:700;animation:dr 1.1s .3s ease forwards}
#st{transition:background .3s,color .3s}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.main.anim polyline{stroke-dasharray:none;stroke-dashoffset:0}}
.pos{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}@media(max-width:900px){.pos{grid-template-columns:1fr}}.cartp{position:sticky;top:10px}.cl{max-height:42vh;overflow:auto}.ci{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.qt{display:flex;align-items:center;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:6px 14px;border-radius:20px}.chip.on{background:var(--bl);color:#fff}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.pc{text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);padding:12px;position:relative;display:flex;flex-direction:column;gap:6px;min-height:120px}.pc.on{border-color:var(--bl);background:#00a6ff1f}.ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0B1F44}.bd{position:absolute;top:8px;right:8px;background:var(--bl);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px}.lw{background:#fef3c7;color:#92400e;border-radius:6px;padding:1px 6px;font-size:10px}
.ov{position:fixed;inset:0;background:#0b1f4499;display:grid;place-items:center;z-index:20;padding:16px}.mdl{width:100%;max-width:380px;animation:pop .25s ease}
body{padding-bottom:46px}#ft{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--nv);color:#cbd5e1;text-align:center;font-size:11px;line-height:1.5;padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px))}#ft a{color:var(--bl);text-decoration:none;font-weight:600}#ft a:hover{text-decoration:underline}.toast{bottom:64px}
#tk{display:none}@media print{@page{size:80mm auto;margin:0}body>*:not(#tk){display:none!important}body{background:#fff}#tk{display:block;width:72mm;margin:0 auto;font:12px monospace;color:#000;background:#fff}}@media(max-width:800px){.app{flex-direction:column}.side{width:auto;flex-direction:row;overflow-x:auto;align-items:center}.side .lg{margin:0 8px 0 0}}
</style></head><body><div id="app"></div><script src="config.js"></script><footer id="ft">Sistema realizado por <b>Santiago Chavez</b> · Todos los derechos reservados · <a href="https://ssantiagochavez.vercel.app/" target="_blank" rel="noopener">ssantiagochavez.vercel.app</a> · <a href="#" onclick="contact();return false">Contacto</a></footer>
<script>
const SB_URL=(window.PUNTOX_CONFIG||{}).SB_URL||'',SB_KEY=(window.PUNTOX_CONFIG||{}).SB_KEY||'';/* Supabase: se configura en config.js (vacío = modo local) */
const CLOUD=!!SB_URL;const K='puntox_v1';let D=null;
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!D)D={locales:[{id:1,n:'Local Central'}],sucs:[{id:1,l:1,n:'Sucursal Central'}],users:[],cli:[],sales:[],seq:10,
prods:[{id:2,c:'7801234500011',n:'Café Premium',pr:3500,st:50,s:1},{id:3,c:'7801234500028',n:'Galletas Mix',pr:1200,st:80,s:1},{id:4,c:'7801234500035',n:'Agua Mineral',pr:900,st:120,s:1}]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};D.cajas=D.cajas||[];
async function hs(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+'|'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,suc=null,view='inicio',cart=[],q='';
const PERM={Master:['inicio','ventas','inventario','clientes','reportes','caja','config'],Administrador:['inicio','ventas','inventario','clientes','reportes','caja'],Cajero:['inicio','ventas','clientes','caja'],Bodeguero:['inicio','inventario']};
const NAV={inicio:'Inicio',ventas:'Ventas',inventario:'Inventario',clientes:'Clientes',reportes:'Reportes',caja:'Caja',config:'Configuración'};
const ICO={inicio:'⌂',ventas:'🛒',inventario:'📦',clientes:'👥',reportes:'📊',caja:'💵',config:'⚙'};
const fmt=n=>'$'+Math.round(n).toLocaleString('es-CL');
const sn=id=>{const s=D.sucs.find(x=>x.id==id);if(!s)return'—';const l=D.locales.find(x=>x.id==s.l);return esc((l?l.n:'')+' · '+s.n)};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)};
const P=()=>D.prods.filter(p=>p.s==suc),S=()=>D.sales.filter(s=>s.s==suc);
const LOGO=(s=40)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00A6FF"/><stop offset="1" stop-color="#0B4DD8"/></linearGradient></defs><path d="M22 20c0-12 20-12 20 0" fill="none" stroke="#00A6FF" stroke-width="5" stroke-linecap="round"/><rect x="6" y="20" width="52" height="38" rx="9" fill="url(#g)"/><path d="M22 28h14a7 7 0 010 14H30v8h-8z" fill="#fff"/><path d="M38 58l10-12 10 12z" fill="#F6A623"/></svg>`;

async function login(){const u=$('#lu').value.trim(),p=$('#lp').value;
 if(CLOUD){try{const r=await rpc('p_login',{p_u:u,p_c:p});if(!r)return toast('Usuario o contraseña incorrectos');CRED={u:r.u,p};me={u:r.u,role:r.role,suc:r.s};await sync();if(me.role=='Master'&&!me.suc)me.suc=D.sucs[0]?D.sucs[0].id:null;if(!me.suc){me=null;CRED=null;return toast('Tu usuario no tiene sucursal asignada')}}catch(e){return toast(e.message)}suc=me.suc;view='inicio';cart=[];return draw()}
 if(u.toUpperCase()==='SACC'){if(!D.mh){if(p.length<8)return toast('Primer acceso: define una clave maestra de 8 o más caracteres');D.ms=crypto.randomUUID();D.mh=await hs(p,D.ms);save();toast('Clave maestra creada')}if(await hs(p,D.ms)!==D.mh)return toast('Usuario o contraseña incorrectos');me={u:'SACC',role:'Master',suc:D.sucs[0]?D.sucs[0].id:null}}
 else{const hp=await hs(p,D.ms||'');const x=D.users.find(x=>x.u.toLowerCase()===u.toLowerCase()&&(x.h?x.h===hp:x.p===p));if(!x)return toast('Usuario o contraseña incorrectos');me={u:x.u,role:x.role,suc:x.s}}
 suc=me.suc;view='inicio';cart=[];draw()}
function logout(){me=null;CRED=null;draw()}
function go(v){view=v;q='';draw()}
function setSuc(v){suc=+v;cart=[];draw()}

function draw(){
 if(!me){$('#app').innerHTML=`<div class="login"><div class="l">${LOGO(110)}<h1>PUNTO<b>X</b></h1><small style="letter-spacing:.4em">SMART POS</small><p>Tu negocio,<br>en un solo <i>punto.</i></p></div><div class="rr"><div class="card"><h2 style="margin-top:0">Iniciar Sesión</h2><small class="mu">Accede a tu cuenta para continuar</small><input id="lu" placeholder="Usuario" autocomplete="username"><input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"><button style="width:100%;margin-top:8px" onclick="login()">Ingresar</button></div></div></div>`;return}
 const perms=PERM[me.role];if(!perms.includes(view))view='inicio';
 const V={inicio:vInicio,ventas:vVentas,inventario:vInv,clientes:vCli,reportes:vRep,caja:vCaja,config:vCfg}[view]();
 const sel=me.role=='Master'?`<select onchange="setSuc(this.value)">${D.sucs.map(s=>`<option value="${s.id}" ${s.id==suc?'selected':''}>${sn(s.id)}</option>`).join('')}</select>`:`<span class="mu">${sn(suc)}</span>`;
 $('#app').innerHTML=`<div class="app"><nav class="side"><div class="lg">${LOGO(30)}<span>PUNTO<b>X</b></span></div>${perms.map(v=>`<button class="nv ${v==view?'on':''}" onclick="go('${v}')"><span>${ICO[v]}</span>${NAV[v]}</button>`).join('')}</nav><main class="main"><div class="top"><h2>${view=='inicio'?'Dashboard':NAV[view]}</h2><div class="r">${sel}<span class="card" style="padding:6px 12px">👤 ${esc(me.u)} · ${me.role}</span><button class="g" onclick="logout()">Salir</button></div></div>${V}</main></div>`;
 const f=$('#sc')||$('#is');if(f)f.focus()}

function vInicio(){const now=new Date(),A=S();
 const m=A.filter(s=>{const d=new Date(s.t);return d.getMonth()==now.getMonth()&&d.getFullYear()==now.getFullYear()});
 const tot=m.reduce((a,s)=>a+s.tot,0),un=m.reduce((a,s)=>a+s.items.reduce((b,i)=>b+(i.kg?1:i.q),0),0);
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=d.toDateString();return{l:['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d.getDay()],v:A.filter(s=>new Date(s.t).toDateString()==k).reduce((a,s)=>a+s.tot,0)}});
 const mx=Math.max(1,...days.map(d=>d.v)),pt=days.map((d,i)=>[30+i*60,130-d.v/mx*105]);
 const top={};A.forEach(s=>s.items.forEach(i=>top[i.n]=(top[i.n]||0)+(i.kg?1:i.q)));const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,4);
 const T=[['ventas','🛒','Ventas Rápidas'],['inventario','📦','Control de Inventario'],['clientes','👥','Gestión de Clientes'],['reportes','📊','Reportes en Tiempo Real']].filter(t=>PERM[me.role].includes(t[0]));
 return `<div class="tiles">${T.map(t=>`<button class="tile" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}<div class="tile"><span>🛡</span>Seguro y Confiable</div></div>
 <div class="grid3"><div class="card kpi"><small>Ventas del Mes</small><div>${fmt(tot)}</div></div><div class="card kpi a"><small>Productos Vendidos</small><div>${un}</div></div><div class="card kpi b"><small>Clientes Activos</small><div>${D.cli.length}</div></div></div>
 <div class="grid2"><div class="card"><h3>Ventas Últimos 7 Días</h3><svg viewBox="0 0 420 160" width="100%"><polyline fill="none" stroke="#00A6FF" stroke-width="3" points="${pt.map(p=>p.join(',')).join(' ')}"/>${pt.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#00A6FF"><title>${fmt(days[i].v)}</title></circle><text x="${p[0]}" y="152" font-size="11" text-anchor="middle" fill="#64748b">${days[i].l}</text>`).join('')}</svg></div>
 <div class="card"><h3>Top Productos</h3>${tp.length?tp.map(t=>`<p><b>${esc(t[0])}</b><br><span class="mu">${t[1]} ventas</span></p>`).join(''):'<p class="mu">Aún no hay ventas.</p>'}</div></div>`}

function vVentas(){return `<div class="grid2"><div class="card"><h3>Escanear o buscar producto</h3><input id="sc" placeholder="Escanea el código de barras o escribe el nombre…" onkeydown="if(event.key=='Enter'){scan(this.value);this.value=''}" oninput="sug(this.value)"><div id="sg" class="sg"></div><p class="mu">El lector USB funciona como teclado: escanea y se agrega solo.</p></div><div class="card"><h3>Venta actual</h3>${cartH()}</div></div>`}
function cartH(){const t=cart.reduce((a,i)=>a+i.pr*i.q,0);
 return `<div class="tw"><table>${cart.map((i,x)=>`<tr><td>${esc(i.n)}</td><td><button class="g" onclick="qty(${x},-1)">−</button> ${i.q} <button class="g" onclick="qty(${x},1)">+</button></td><td>${fmt(i.pr*i.q)}</td></tr>`).join('')||'<tr><td class="mu">Sin productos</td></tr>'}</table></div><div class="tot">${fmt(t)}</div>
 <div class="row"><select id="pm"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select><select id="cl"><option value="">Cliente (opcional)</option>${D.cli.map(c=>`<option>${esc(c.n)}</option>`).join('')}</select></div><button class="o" style="width:100%;margin-top:8px" onclick="pay()" ${cart.length?'':'disabled'}>Cobrar</button>`}
function sug(v){v=v.trim().toLowerCase();$('#sg').innerHTML=v.length<2?'':P().filter(p=>p.n.toLowerCase().includes(v)||p.c.includes(v)).slice(0,6).map(p=>`<button onclick="add(${p.id})">${esc(p.n)} — ${fmt(p.pr)} <small>(stock ${p.st})</small></button>`).join('')}
function scan(v){v=v.trim();if(!v)return;const a=P(),p=a.find(x=>x.c==v)||(a.filter(x=>x.n.toLowerCase().includes(v.toLowerCase())).length==1?a.find(x=>x.n.toLowerCase().includes(v.toLowerCase())):null);p?add(p.id):toast('Producto no encontrado: '+v)}
function add(id){const p=D.prods.find(x=>x.id==id),i=cart.find(x=>x.id==id);if((i?i.q:0)+1>p.st)return toast('Sin stock suficiente');i?i.q++:cart.push({id,n:p.n,pr:p.pr,q:1});draw()}
function qty(x,d){cart[x].q+=d;const p=D.prods.find(p=>p.id==cart[x].id);if(cart[x].q>p.st){cart[x].q=p.st;toast('Sin stock suficiente')}if(cart[x].q<1)cart.splice(x,1);draw()}
function pay(){if(!cur())return toast('Abre la caja antes de vender');const tot=cart.reduce((a,i)=>a+i.pr*i.q,0);cart.forEach(i=>D.prods.find(p=>p.id==i.id).st-=i.q);
 D.sales.push({id:D.seq++,cj:cur().id,t:Date.now(),s:suc,u:me.u,tot,m:$('#pm').value,c:$('#cl').value,items:cart.map(i=>({...i}))});save();cart=[];toast('Venta registrada ✔');draw()}

function vInv(){return `<div class="grid2"><div class="card"><h3>Producto</h3><input id="ic" placeholder="Código de barras (escanea aquí)" onkeydown="if(event.key=='Enter'){event.preventDefault();$('#in').focus()}"><input id="in" placeholder="Nombre"><input id="icat" list="cl2" placeholder="Categoría (opcional)"><select id="iu"><option value="un">Se vende por unidad</option><option value="kg">Se vende por kilo (peso)</option></select><datalist id="cl2">${[...new Set(P().map(p=>p.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist><div class="row"><input id="ip" type="number" step="any" placeholder="Precio (por unidad o por kg)"><input id="ist" type="number" step="any" placeholder="Stock (unid. o kg)"></div><button style="width:100%;margin-top:6px" onclick="saveP()">Guardar producto</button><p class="mu">Si el código ya existe, se actualiza.</p></div>
 <div class="card"><h3>Inventario</h3><input id="is" placeholder="Escanea o busca…" oninput="q=this.value;$('#tb').innerHTML=rows()" onkeydown="if(event.key=='Enter'){const p=P().find(x=>x.c==this.value.trim());if(p)edit(p.id);else{$('#ic').value=this.value;$('#in').focus()}}"><div class="tw"><table><tr><th>Código</th><th>Producto</th><th>Precio</th><th>Stock</th><th></th></tr><tbody id="tb">${rows()}</tbody></table></div></div></div>`}

async function rpc(f,a){const r=await fetch(SB_URL+'/rest/v1/rpc/'+f,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(a)});if(!r.ok){let m='Error de conexión con el servidor';try{m=(await r.json()).message||m}catch(e){}throw new Error(m)}const t=await r.text();return t?JSON.parse(t):null}

let vc='Todos',vq='',CATS=[];const COL=['#e0f2fe','#dcfce7','#fef3c7','#fce7f3','#ede9fe'];
function nextN(){return Math.max(0,...S().map(x=>x.n||0))+1}
function tt(){return cart.reduce((a,i)=>a+i.pr*i.q,0)}
function grid(){const v=vq.toLowerCase();return P().filter(p=>(vc=='Todos'||p.cat==vc)&&(!v||p.n.toLowerCase().includes(v)||p.c.includes(v))).map(p=>{const i=cart.find(x=>x.id==p.id);return `<button class="pc ${i?'on':''}" onclick="add(${p.id})"><span class="ic" style="background:${COL[p.id%5]}">${esc(p.n[0].toUpperCase())}</span>${i?`<span class="bd">${i.q}</span>`:''}<b>${esc(p.n)}</b><div>${fmt(p.pr)}${p.u=='kg'?'/kg':''} ${p.st<=5?`<small class="lw">Quedan ${fq(p.st,p)}</small>`:''}</div></button>`}).join('')||'<p class="mu">Sin productos. Agrégalos en Inventario.</p>'}

 return `<div class="pos"><div><input id="sc" placeholder="Busca o escanea un producto" value="${esc(vq)}" oninput="vq=this.value;$('#pg').innerHTML=grid()" onkeydown="if(event.key=='Enter'){scan(this.value);this.value='';vq='';$('#pg').innerHTML=grid()}"><div class="chips">${CATS.map((c,i)=>`<button class="chip ${c==vc?'on':''}" onclick="setCat(${i})">${esc(c)}</button>`).join('')}</div><div id="pg" class="pg">${grid()}</div></div><div class="card cartp" id="cart">${cartH()}</div></div>`}

 return `<div class="top" style="margin:0 0 8px"><div><h3 style="margin:0">Venta actual</h3><small class="mu">Ticket #${String(nextN()).padStart(6,'0')} · ${u} productos</small></div><button class="g" onclick="cart=[];refresh()">Vaciar</button></div><div class="cl">${cart.map((i,x)=>`<div class="ci"><div><b>${esc(i.n)}</b><br><small class="mu">${fmt(i.pr)}${i.kg?'/kg':' c/u'}</small></div><div class="qt">${i.kg?`<b>${i.q.toLocaleString('es-CL',{maximumFractionDigits:3})} kg</b><button class="g" onclick="cart.splice(${x},1);refresh()">✕</button>`:`<button class="g" onclick="qty(${x},-1)">−</button><b>${i.q}</b><button class="g" onclick="qty(${x},1)">+</button>`}</div><b>${fmt(lt(i))}</b></div>`).join('')||'<p class="mu">Escanea o toca un producto</p>'}</div><div class="row" style="align-items:end;margin-top:8px"><span>Total</span><span class="tot" style="margin:0;text-align:right">${fmt(tt())}</span></div><select id="cl"><option value="">Cliente (opcional)</option>${D.cli.map(c=>`<option>${esc(c.n)}</option>`).join('')}</select><button style="width:100%;margin:6px 0" onclick="cash()" ${ok}>Cobrar en Efectivo</button><div class="row"><button class="o" onclick="pay('Tarjeta')" ${ok}>Tarjeta</button><button class="o" onclick="pay('Transferencia')" ${ok}>Transferencia</button></div>`}
function refresh(){const c=$('#cl')?$('#cl').value:'';if($('#pg'))$('#pg').innerHTML=grid();if($('#cart'))$('#cart').innerHTML=cartH();if($('#cl'))$('#cl').value=c;const f=$('#sc');if(f&&!$('#md'))f.focus()}
function add(id){const p=D.prods.find(x=>x.id==id),i=cart.find(x=>x.id==id);if((i?i.q:0)+1>p.st)return toast('Sin stock suficiente');i?i.q++:cart.push({id,n:p.n,pr:p.pr,q:1});refresh()}

function modal(h){closeM();const m=document.createElement('div');m.id='md';m.className='ov';m.innerHTML=`<div class="card mdl">${h}</div>`;document.body.appendChild(m)}
function closeM(){const m=$('#md');if(m)m.remove()}
function cash(){if(!cur())return toast('Abre la caja antes de vender');const t=tt();
 modal(`<h3>Cobro en efectivo</h3><small class="mu">Total a pagar</small><div class="tot">${fmt(t)}</div><input id="rc" type="number" inputmode="numeric" placeholder="Monto que entrega el cliente" oninput="chg(${t})" onkeydown="if(event.key=='Enter')okCash(${t})"><div class="row">${[t,...[5000,10000,20000,50000].filter(b=>b>t)].slice(0,4).map(v=>`<button class="g" onclick="$('#rc').value=${v};chg(${t})">${v==t?'Exacto':fmt(v)}</button>`).join('')}</div><div id="vl" class="tot">Vuelto: $0</div><div class="row"><button class="g" onclick="closeM();refresh()">Cancelar</button><button id="okb" disabled onclick="okCash(${t})">Confirmar</button></div>`);$('#rc').focus()}
function chg(t){const r=+$('#rc').value||0;$('#vl').textContent=r>=t?'Vuelto: '+fmt(r-t):(r>0?'Falta: '+fmt(t-r):'Vuelto: $0');$('#okb').disabled=r<t}

function pay(m,rec){if(!cur())return toast('Abre la caja antes de vender');if(!cart.length)return;const tot=tt();cart.forEach(i=>{const p=D.prods.find(p=>p.id==i.id);p.st=Math.round((p.st-i.q)*1000)/1000});
 const v={id:D.seq++,n:nextN(),cj:cur().id,t:Date.now(),s:suc,u:me.u,tot,m,c:($('#cl')||{}).value||'',rec:rec||tot,items:cart.map(i=>({...i}))};
 D.sales.push(v);save();cart=[];showOK(v);printV(v);refresh()}
function showOK(v){modal(`<div style="text-align:center"><div style="font-size:54px">✅</div><h2 style="margin:4px 0">¡Compra exitosa!</h2><p class="mu">Venta N° ${String(v.n).padStart(6,'0')}</p>${v.m=='Efectivo'?`<p>Recibido ${fmt(v.rec)} · Total ${fmt(v.tot)}</p><div class="tot">Vuelto: ${fmt(v.rec-v.tot)}</div>`:`<div class="tot">${fmt(v.tot)}</div><p class="mu">${v.m}</p>`}<button id="nb" class="o" style="width:100%" onclick="closeM();refresh()">Nueva venta</button></div>`);$('#nb').focus()}
function printV(v){const L=(a,b)=>`<div style="display:flex;justify-content:space-between;gap:6px"><span>${a}</span><span>${b}</span></div>`,hr='<hr style="border:0;border-top:1px dashed #000">';
 let t=$('#tk');if(!t){t=document.createElement('div');t.id='tk';document.body.appendChild(t)}
 t.innerHTML=`<div style="text-align:center"><b>PUNTOX SMART POS</b><br>${sn(v.s)}<br><b>VENTA N° ${String(v.n).padStart(6,'0')}</b><br>${new Date(v.t).toLocaleString('es-CL')}</div>${hr}${L('Cajero',esc(v.u))}${hr}${v.items.map(i=>`<div>${esc(i.n)}</div>`+L((i.kg?i.q.toLocaleString('es-CL',{maximumFractionDigits:3})+' kg x '+fmt(i.pr)+'/kg':i.q+' x '+fmt(i.pr)),fmt(lt(i)))).join('')}${hr}${L('<b>TOTAL</b>','<b>'+fmt(v.tot)+'</b>')}${L('Pago',v.m)}${v.m=='Efectivo'?L('Recibido',fmt(v.rec))+L('Vuelto',fmt(v.rec-v.tot)):''}${hr}<div style="text-align:center">¡Gracias por su compra!</div>`;
 setTimeout(()=>window.print(),300)}

 modal(`<h3>Contacto</h3><p><b>Santiago Chavez</b><br><span class="mu">Licenciado en Administración de Empresas<br>La Calera, Valparaíso, Chile</span></p><p>🌐 <a href="https://ssantiagochavez.vercel.app/" target="_blank" rel="noopener">ssantiagochavez.vercel.app</a></p>${e?`<p>✉ <a href="mailto:${esc(e)}">${esc(e)}</a></p>`:''}${w?`<p>💬 <a href="https://wa.me/${w}" target="_blank" rel="noopener">WhatsApp +${w}</a></p>`:''}<button style="width:100%" onclick="closeM()">Cerrar</button>`)}
function fq(n,p){return p.u=='kg'?(Math.round(n*1000)/1000).toLocaleString('es-CL',{maximumFractionDigits:3})+' kg':n}
function lt(i){return Math.round(i.pr*i.q)}
function tt(){return cart.reduce((a,i)=>a+lt(i),0)}
function add(id){const p=D.prods.find(x=>x.id==id);if(p.u=='kg')return wmodal(id);const i=cart.find(x=>x.id==id);if((i?i.q:0)+1>p.st)return toast('Sin stock suficiente');i?i.q++:cart.push({id,n:p.n,pr:p.pr,q:1});refresh()}
function wmodal(id){const p=D.prods.find(x=>x.id==id);
 modal(`<h3>${esc(p.n)}</h3><small class="mu">${fmt(p.pr)} por kg · disponible ${fq(p.st,p)}</small><div class="row" style="margin-top:8px"><input id="wq" type="number" step="any" inputmode="decimal" placeholder="Cantidad" oninput="wchg(${id})" onkeydown="if(event.key=='Enter')wok(${id})"><select id="wu" onchange="wchg(${id})" style="flex:0 0 100px"><option value="g">gramos</option><option value="kg">kilos</option></select></div><div class="row">${[100,250,500,1000].map(g=>`<button class="g" onclick="$('#wu').value='g';$('#wq').value=${g};wchg(${id})">${g<1000?g+' g':'1 kg'}</button>`).join('')}</div><div id="wp" class="tot">$0</div><div class="row"><button class="g" onclick="closeM();refresh()">Cancelar</button><button id="wb" disabled onclick="wok(${id})">Agregar</button></div>`);$('#wq').focus()}
function wkg(){const v=+$('#wq').value||0;return $('#wu').value=='g'?v/1000:v}
function wchg(id){const p=D.prods.find(x=>x.id==id),k=wkg(),ex=cart.find(x=>x.id==id),over=k+(ex?ex.q:0)>p.st+1e-9;$('#wp').textContent=over?'Sin stock suficiente':fmt(p.pr*k)+(k>0?' · '+k.toLocaleString('es-CL',{maximumFractionDigits:3})+' kg':'');$('#wb').disabled=!(k>0)||over}
function wok(id){const p=D.prods.find(x=>x.id==id),k=Math.round(wkg()*1000)/1000,ex=cart.find(x=>x.id==id);if(!(k>0)||k+(ex?ex.q:0)>p.st+1e-9)return;ex?ex.q=Math.round((ex.q+k)*1000)/1000:cart.push({id,n:p.n,pr:p.pr,q:k,kg:1});closeM();refresh()}

 const s=sm(c);
 return `<div class="card"><h3>Cuadre de caja · abierta ${new Date(c.op).toLocaleString('es-CL')}</h3><div class="grid2"><div><small class="mu">CONTEO DE BILLETES Y MONEDAS</small>${DEN.map(d=>`<div class="row" style="align-items:center;flex-wrap:nowrap"><b style="flex:0 0 80px">${fmt(d)}</b><input class="dn" type="number" min="0" data-v="${d}" value="${c.cnt[d]||''}" oninput="recalc()"><span id="s${d}" style="flex:0 0 80px;text-align:right">$0</span></div>`).join('')}<p class="row" style="background:#a8d5b5;color:#0B1F44;padding:8px;border-radius:8px"><b>TOTAL CONTADO</b><b id="tc" style="text-align:right">$0</b></p></div>
 <div><p>Fondo inicial: <b>${fmt(c.fo)}</b></p><p>Ventas (${s.n}): <b>${fmt(s.tot)}</b></p><p>Efectivo: <b>${fmt(s.ef)}</b> · Tarjeta/Transbank: <b>${fmt(s.tj)}</b> · Transferencias: <b>${fmt(s.tr)}</b></p><small class="mu">GASTOS</small><div class="row"><input id="gd" placeholder="Descripción"><input id="gm" type="number" placeholder="Monto"><button class="o" style="flex:0" onclick="addG()">+ Gasto</button></div>${c.g.map((g,i)=>`<p>${esc(g.d)}: ${fmt(g.m)} <button class="g" onclick="delG(${i})">✕</button></p>`).join('')}<p>TOTAL GASTOS: <b>${fmt(gs(c))}</b></p><p>EFECTIVO A CUADRAR (fondo + ventas en efectivo − gastos): <b>${fmt(c.fo+s.ef-gs(c))}</b></p></div></div><div id="st" style="text-align:center;font-weight:800;font-size:18px;padding:16px;border-radius:12px;margin-top:10px"></div><button class="o" id="cb" style="width:100%;margin-top:8px" onclick="closeC()">Cerrar caja e imprimir</button></div>`+H}
function recalc(){const c=cur();if(!c)return;let t=0;document.querySelectorAll('.dn').forEach(i=>{const d=i.dataset.v,n=Math.max(0,+i.value||0);c.cnt[d]=n;t+=n*d;$('#s'+d).textContent=fmt(n*d)});save();
 const ex=c.fo+sm(c).ef-gs(c),df=t-ex,e=$('#st');$('#tc').textContent=fmt(t);e.textContent=df==0?'CUADRADO':(df<0?'FALTANTE '+fmt(-df):'SOBRANTE '+fmt(df));e.style.background=df==0?'#d9ece0':'#fde2e2';e.style.color=df==0?'#065f2c':'#b91c1c';$('#cb').disabled=df!=0}
function openC(){const v=$('#fo').value,fo=+v;if(v===''||isNaN(fo)||fo<0)return toast('Ingresa el fondo inicial');D.cajas.push({id:D.seq++,s:suc,u:me.u,op:Date.now(),fo,cnt:{},g:[],cl:null});save();toast('Caja abierta');draw()}
function addG(){const c=cur(),d=$('#gd').value.trim(),m=+$('#gm').value;if(!d||!(m>0))return toast('Ingresa descripción y monto');c.g.push({d,m});save();draw()}
function delG(i){cur().g.splice(i,1);save();draw()}
function closeC(){const c=cur();recalc();if($('#cb').disabled)return toast('La caja debe estar cuadrada para cerrar');const s=sm(c);Object.assign(c,{cl:Date.now(),tot:s.tot,ef:s.ef,tj:s.tj,tr:s.tr,n:s.n,ex:c.fo+s.ef-gs(c)});save();prt(c.id);draw()}
function prt(id){const c=D.cajas.find(x=>x.id==id),L=(a,b)=>`<div style="display:flex;justify-content:space-between"><span>${a}</span><span>${b}</span></div>`,f=t=>new Date(t).toLocaleString('es-CL'),hr='<hr style="border:0;border-top:1px dashed #000">';
 let tot=0;const bl=DEN.filter(d=>c.cnt[d]).map(d=>{tot+=c.cnt[d]*d;return L(c.cnt[d]+' x '+fmt(d),fmt(c.cnt[d]*d))}).join('');
 let t=$('#tk');if(!t){t=document.createElement('div');t.id='tk';document.body.appendChild(t)}
 t.innerHTML=`<div style="text-align:center"><b>PUNTOX SMART POS</b><br>${sn(c.s)}<br><b>CIERRE DE CAJA #${c.id}</b></div>${hr}${L('Cajero',esc(c.u))}${L('Apertura',f(c.op))}${L('Cierre',f(c.cl))}${hr}${L('Fondo inicial',fmt(c.fo))}${L('Ventas ('+c.n+')',fmt(c.tot))}${L('Efectivo',fmt(c.ef))}${L('Tarjeta',fmt(c.tj))}${L('Transferencia',fmt(c.tr))}${hr}<b>GASTOS</b>${c.g.map(g=>L(esc(g.d),fmt(g.m))).join('')||'<div>Sin gastos</div>'}${L('Total gastos',fmt(gs(c)))}${hr}<b>CONTEO</b>${bl}${L('<b>Total contado</b>',fmt(tot))}${L('Efectivo a cuadrar',fmt(c.ex))}<div style="text-align:center;margin-top:6px"><b>${tot==c.ex?'CUADRADO':'DIFERENCIA '+fmt(tot-c.ex)}</b></div>${hr}<div style="text-align:center">Firma: ______________</div>`;
 setTimeout(()=>window.print(),150)}
const _d=draw;draw=function(){const ch=!me||window._lv!==view;_d();lsel();if(me&&view=='caja')recalc();if(!me)window._lv=null;else if(window._lv!==view){window._lv=view;const m=$('.main');if(m)m.classList.add('anim')}};
</script></body></html>
